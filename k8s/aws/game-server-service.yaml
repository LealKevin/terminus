apiVersion: v1
kind: Service
metadata:
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
  labels:
    io.kompose.service: game-server
  name: game-server
spec:
  type: LoadBalancer
  ports:
    - name: "game"
      port: 4200
      targetPort: 4200
      protocol: TCP
    - name: "metrics"
      port: 2112
      targetPort: 2112
      protocol: TCP
  selector:
    io.kompose.service: game-server