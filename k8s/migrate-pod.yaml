apiVersion: v1
kind: Pod
metadata:
  annotations:
    kompose.cmd: kompose convert -f ../docker-compose.yml
    kompose.version: 1.37.0 (HEAD)
  labels:
    io.kompose.service: migrate
  name: migrate
spec:
  containers:
    - args:
        - -path=/migrations
        - -database=postgres://terminus:terminus@postgres:5432/terminus?sslmode=disable
        - up
      image: migrate/migrate
      name: game-migrate
      volumeMounts:
        - mountPath: /migrations
          name: migrate-cm0
  restartPolicy: Never
  volumes:
    - configMap:
        name: migrate-cm0
      name: migrate-cm0
