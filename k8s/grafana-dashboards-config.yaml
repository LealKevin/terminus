        {
          "id": 1,
          "title": "Pod Count",
          "type": "stat",
          "targets": [
            {
              "expr": "count(kube_pod_info{namespace=\"default\"})",
              "refId": "A"
            }
          ],
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "thresholds": {
                "steps": [
                  {"color": "green", "value": null}
                ]
              }
            }
          }
        },
        {
          "id": 2,
          "title": "Game Server Pods",
          "type": "stat",
